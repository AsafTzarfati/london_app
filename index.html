<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>לונדון 10–15.12</title>
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="sr">לונדון 10–15.12</h1>
    <label class="search">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="חיפוש בלונדון · 10&lrm;–&lrm;15.12" aria-label="חיפוש מקום">
    </label>
    <nav aria-label="סינון">
      <div id="cats" role="group" aria-label="קטגוריה"></div>
      <div class="selects">
        <select id="route" aria-label="מסלול"></select>
        <select id="day" aria-label="יום"></select>
        <select id="pri" aria-label="עדיפות"></select>
      </div>
    </nav>
  </header>

  <div id="map"></div>

  <div id="sheet">
    <button id="near" type="button" aria-label="קרוב אליי: הצג את המיקום שלי" title="קרוב אליי">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="3.2" fill="currentColor"/>
        <path d="M12 1.5V5M12 19v3.5M1.5 12H5M19 12h3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="surface">
      <button id="handle" type="button" aria-label="הרחב את הרשימה"><span></span></button>
      <p id="status" role="status">טוען…</p>
      <div id="sheetBody">
        <section id="routeBar" aria-labelledby="routeName" hidden>
          <div class="route-text">
            <h2 id="routeName" dir="auto"></h2>
            <p id="routeMeta"></p>
          </div>
          <button id="routeEdit" type="button">ערוך</button>
          <button id="routeShare" type="button">שתף</button>
          <button id="routeDel" type="button">מחק</button>
        </section>

        <section id="sign" aria-labelledby="signName" hidden>
          <p id="signLabel">הכי קרוב עכשיו</p>
          <h2 id="signName" dir="auto"></h2>
          <p id="signMeta"></p>
          <a id="signNav" class="go" target="_blank" rel="noopener">נווט לשם</a>
          <div class="sign-actions">
            <button id="signMap" type="button">במפה</button>
            <button id="signDone" type="button">בוצע</button>
          </div>
        </section>

        <main id="list"></main>
      </div>
    </div>
  </div>

  <!-- Route editor: a full-screen mode over the same map (body.editing) -->
  <section id="editor" aria-label="עריכת מסלול">
    <div class="ed-head">
      <button id="edBack" type="button" aria-label="סיום עריכה, חזרה לרשימה">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        סיום
      </button>
      <input id="edName" dir="auto" maxlength="60" autocomplete="off" enterkeyhint="done" aria-label="שם המסלול">
    </div>
    <ol id="edStops"></ol>
    <div class="ed-add">
      <input id="edQ" type="search" autocomplete="off" enterkeyhint="search" placeholder="+ הוספת עצירה…" aria-label="הוספת עצירה: חיפוש מקום" aria-controls="edResults">
      <ul id="edResults" hidden></ul>
    </div>
  </section>
  <p id="edInfo" role="status"></p>

  <template id="card">
    <article class="card">
      <span class="thumb" aria-hidden="true"></span>
      <div class="body">
        <h3 dir="auto"></h3>
        <p class="meta"></p>
        <p class="walk" hidden></p>
        <p class="tags"></p>
        <p class="notes"></p>
      </div>
      <div class="actions">
        <label class="done"><input type="checkbox"></label>
        <a class="nav" target="_blank" rel="noopener">נווט</a>
      </div>
    </article>
  </template>

  <script src="csv.js" defer></script>
  <script src="near.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
